name: R1 ESP32 compile check
on:
  push:
    branches:
      - feature/r1-core-refactor-20261029
  pull_request:
    branches:
      - feature/1b-ssh-feasibility-20261029
  workflow_dispatch:

jobs:
  platformio:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install "platformio>=6.1,<7"
      - name: Compile legacy default firmware (regression)
        run: pio run -e esp32dev
      - name: Compile isolated R1 SSH feasibility firmware
        run: pio run -e esp32dev_ssh_feasibility
