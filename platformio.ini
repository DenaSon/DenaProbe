[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Preserve the known-good v0.0.4 firmware as the default build.
build_src_filter = +<main.cpp>

; Isolated Phase 1B.1 feasibility firmware. Does NOT change v0.0.4.
[env:esp32dev_ssh_feasibility]
extends = env:esp32dev
build_src_filter = +<ssh_feasibility_main.cpp>
; Experimental 4MB ESP32 partition layout: two 0x1E0000 (1.875MiB)
; OTA app slots. The default v0.0.4 environment retains its partitions.
; Smaller SPIFFS area; do not use on devices with valued SPIFFS data.
board_build.partitions = min_spiffs.csv
lib_deps =
    https://github.com/ewpa/LibSSH-ESP32.git#343fce1c5d1d0e3d629807dece6ae1b68ef1d322
build_flags =
    -DBUFFER_SIZE_MAX=16384
    -DWINDOW_DEFAULT=8000
